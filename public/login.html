<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <title>Private Access — Srusti MBA Attendance</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --card: rgba(30, 41, 59, 0.86);
        --border: rgba(148, 163, 184, 0.22);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #34d399;
        --accent-dark: #10b981;
        --danger: #fb7185;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(900px 500px at 15% 0%, rgba(16, 185, 129, 0.16), transparent 60%),
          radial-gradient(700px 500px at 90% 100%, rgba(20, 184, 166, 0.14), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 36px 32px 30px;
        box-shadow: 0 30px 70px rgba(2, 6, 23, 0.55);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .lock {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent), #2dd4bf);
        color: #052e22;
        box-shadow: 0 12px 30px rgba(16, 185, 129, 0.3);
        margin-bottom: 22px;
      }

      .lock svg { width: 26px; height: 26px; }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: -0.02em;
        font-weight: 750;
      }

      .subtitle {
        margin: 0 0 26px;
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--muted);
      }

      .error {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 18px;
        padding: 11px 14px;
        font-size: 13px;
        font-weight: 500;
        color: #fecdd3;
        background: rgba(244, 63, 94, 0.12);
        border: 1px solid rgba(244, 63, 94, 0.35);
        border-radius: 12px;
      }

      .error[hidden] { display: none; }

      .field {
        position: relative;
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 13px 46px 13px 14px;
        font-size: 15px;
        font-family: inherit;
        color: var(--text);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      input[type="password"]:focus,
      input[type="text"]:focus {
        border-color: rgba(52, 211, 153, 0.7);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.14);
      }

      .toggle {
        position: absolute;
        right: 8px;
        bottom: 7px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 7px 8px;
        border-radius: 8px;
        cursor: pointer;
      }

      .toggle:hover { color: var(--text); background: rgba(148, 163, 184, 0.12); }

      button[type="submit"] {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 18px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #042f23;
        background: linear-gradient(135deg, var(--accent), #2dd4bf);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 14px 28px rgba(16, 185, 129, 0.24);
        transition: filter 150ms ease, transform 150ms ease;
      }

      button[type="submit"]:hover { filter: brightness(1.06); }
      button[type="submit"]:active { transform: translateY(1px); }

      .footer {
        margin: 22px 0 0;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.02em;
        color: #64748b;
      }

      @media (max-width: 420px) {
        .card { padding: 28px 22px 24px; border-radius: 20px; }
        h1 { font-size: 20px; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          <circle cx="12" cy="15.5" r="1.4" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>

      <h1>Private attendance register</h1>
      <p class="subtitle">
        This page contains student names and attendance records. Enter the access
        password to continue.
      </p>

      <div class="error" id="error-box" role="alert" hidden>
        <span aria-hidden="true">⚠</span>
        <span>Incorrect password. Please try again.</span>
      </div>

      <form method="POST" action="/api/login" autocomplete="off">
        <input type="hidden" id="next-field" name="next" value="/" />

        <div class="field">
          <label for="password">Access password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
            autofocus
          />
          <button class="toggle" id="toggle-password" type="button" aria-label="Show password">
            Show
          </button>
        </div>

        <button type="submit">
          Unlock register
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </button>
      </form>

      <p class="footer">Srusti MBA · Attendance Register</p>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next');
        var nextField = document.getElementById('next-field');
        var password = document.getElementById('password');
        var toggle = document.getElementById('toggle-password');
        var errorBox = document.getElementById('error-box');

        if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') {
          nextField.value = next;
        }

        if (params.get('error') === '1') {
          errorBox.hidden = false;
        }

        if (password) {
          password.focus();
        }

        toggle.addEventListener('click', function () {
          var showing = password.type === 'text';
          password.type = showing ? 'password' : 'text';
          toggle.textContent = showing ? 'Show' : 'Hide';
          toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          password.focus();
        });
      })();
    </script>
  </body>
</html>
